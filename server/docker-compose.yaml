services:
  db:
    image: postgres:16-alpine
    container_name: brevly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brevly
      POSTGRES_PASSWORD: brevly
      POSTGRES_DB: brevly
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brevly -d brevly"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: brevly-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://brevly:brevly@db:5432/brevly
    ports:
      - "${PORT:-3333}:${PORT:-3333}"

volumes:
  db:
